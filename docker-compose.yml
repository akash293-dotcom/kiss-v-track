services:
  postgres:
    image: postgres:16-alpine
    container_name: kiss-vtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kiss_vtrack
      POSTGRES_USER: kiss_user
      POSTGRES_PASSWORD: kiss_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiss_user -d kiss_vtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: kiss-vtrack-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://kiss_user:kiss_password@postgres:5432/kiss_vtrack?schema=public
      JWT_SECRET: dev-jwt-secret-change-in-production-32chars
      SESSION_SECRET: dev-session-secret-change-in-production
      CORS_ORIGIN: http://localhost:5173
      PORT: 5000
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/uploads
      LOG_LEVEL: debug
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: kiss-vtrack-web
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads: