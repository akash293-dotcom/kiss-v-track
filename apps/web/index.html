<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="KISS V-TRACK — Vocational Training & Skill Tracking System. Learn. Practice. Create. Get Skilled." />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>KISS V-TRACK — Vocational Training & Skill Tracking</title>
    <style>
      /* Critical inline styles for fast initial render */
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; }
      #root { min-height: 100vh; }
      .app-loader { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
      .app-loader .spinner { width: 48px; height: 48px; border: 4px solid #e0e7ff; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="spinner"></div>
        <p style="margin-top:16px;color:#6b7280;font-size:14px;">Loading KISS V-TRACK...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
